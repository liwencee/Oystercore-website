# Trivy exceptions for the app images (CI: the `images` job; see .github/workflows/ci.yml).
# CI runs Trivy with --severity HIGH,CRITICAL --ignore-unfixed, so only findings that have a
# fix are listed here, and only the ones Trivy actually reports. Each entry is an exact id with
# its reason and an expiry date. Nothing is ignored in bulk, and nothing here is permanent:
# after its expired_at date Trivy stops ignoring the entry and the scan fails again, which is
# the reminder. Remove an entry when its reason is gone (the next scan then proves it), or move
# the date on purpose, in a commit that says why.
#
# The same advisories are the temporary exceptions in pnpm-workspace.yaml (auditConfig), which
# has no expiry of its own: remove those at the same time.
#
# infra/images/ci-config.test.sh checks the shape of this file.
vulnerabilities:
  # TEMPORARY until the Astro 7 upgrade (ledger R18)
  - id: GHSA-26w7-cxv4-gfx2
    statement: >-
      astro < 7.2.8: remote code execution through AVIF image optimisation (website image).
      Astro 7 needs Node 22.23.4 or newer. Not reachable now: the image service is passthrough
      (apps/web/astro.config.mjs), so Astro's AVIF optimiser is never called.
    expired_at: 2027-03-01

  # TEMPORARY until the Astro 7 upgrade (ledger R18)
  - id: CVE-2026-102984
    statement: >-
      @astrojs/node <= 11.1.2: a malformed port in the Host header can crash the server
      (website image). Trivy reports it under its CVE id; it is advisory GHSA-qh8j-hqjv-7m4x,
      the one in pnpm-workspace.yaml. The fix, 11.1.3, needs Astro 7.
    expired_at: 2027-03-01
