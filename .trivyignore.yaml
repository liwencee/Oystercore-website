# Trivy exceptions for the app images (CI: the `images` job; see .github/workflows/ci.yml).
# CI runs Trivy with --severity HIGH,CRITICAL --ignore-unfixed, so only findings that have a
# fix are listed here, and only the ones Trivy actually reports. Each entry is an exact id with
# its reason. Nothing is ignored in bulk, and nothing here is permanent: remove an entry when
# the reason below is gone, and the next scan then proves it.
#
# The same advisories are the temporary exceptions in pnpm-workspace.yaml (auditConfig).

# TEMPORARY until the Astro 7 upgrade (ledger R18)
# astro < 7.2.8: remote code execution through AVIF image optimisation (website image).
# Astro 7 needs Node 22.23.4 or newer. Not reachable now: the image service is passthrough
# (apps/web/astro.config.mjs), so Astro's AVIF optimiser is never called.
GHSA-26w7-cxv4-gfx2

# TEMPORARY until the Astro 7 upgrade (ledger R18)
# @astrojs/node <= 11.1.2: a malformed port in the Host header can crash the server (website
# image). Trivy reports it under its CVE id; it is advisory GHSA-qh8j-hqjv-7m4x, the one in
# pnpm-workspace.yaml. The fix, 11.1.3, needs Astro 7.
CVE-2026-102984
