<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a,button{cursor:pointer}
a:hover{opacity:.88}
:focus-visible{outline:2px solid #FFFFFF;outline-offset:0;box-shadow:0 0 0 5px #0B1F3A}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; z-index: 60; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; color: #0B1F3A;">
  <div style="background: #0B1F3A; color: #D3DAE6; font-size: 13px; line-height: 20px;">
    <div style="max-width: 1360px; margin: 0 auto; padding: 10px 40px; display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; justify-content: space-between;">
      <span>Emergency line: <strong style="color: #FFFFFF; font-weight: 600;">[Emergency number]</strong></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center;">
        <a href="Procurement.dc.html" style="color: #FFFFFF;">Procurement</a>
        <a href="Careers.dc.html" style="color: #FFFFFF;">Careers</a>
        <a href="Investors.dc.html" style="color: #FFFFFF;">Investors</a>
        <span style="display: inline-flex; align-items: center; gap: 6px; color: #FFFFFF;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"></path></svg>
          EN
        </span>
      </div>
    </div>
  </div>
  <div style="border-bottom: 1px solid #E3E7EE; background: #FFFFFF;">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 40px; min-height: 80px; display: flex; flex-wrap: wrap; gap: 12px 36px; align-items: center; justify-content: space-between;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #0B1F3A;" aria-label="OysterCore Group home">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#0B1F3A"></circle><path d="M18 7.5a10.5 10.5 0 1 0 10.5 10.5" fill="none" stroke="#C9A24B" stroke-width="3" stroke-linecap="round"></path><circle cx="18" cy="18" r="3.6" fill="#C9A24B"></circle></svg>
        <span style="font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.14em; line-height: 1;">OYSTERCORE<span style="display: block; font-weight: 600; font-size: 10px; letter-spacing: 0.4em; color: #5B6678; margin-top: 4px;">GROUP</span></span>
      </a>
      <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 28px; align-items: center;">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <span style="display: inline-flex;">
            <sc-if value="{{item.isLink}}" hint-placeholder-val="{{true}}">
              <a href="{{item.href}}" style="font-size: 15px; font-weight: 600; padding: 28px 0 24px; color: #0B1F3A; border-bottom: 3px solid {{item.line}};">{{item.label}}</a>
            </sc-if>
            <sc-if value="{{item.isMenu}}" hint-placeholder-val="{{false}}">
              <button onClick="{{item.toggle}}" aria-expanded="{{item.expanded}}" style="display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; border-bottom: 3px solid {{item.line}}; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; padding: 28px 0 24px; color: #0B1F3A; cursor: pointer;">
                {{item.label}}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
            </sc-if>
          </span>
        </sc-for>
      </nav>
      <div style="display: flex; align-items: center; gap: 14px;">
        <button aria-label="Search the site" style="width: 44px; height: 44px; border: 1px solid #CBD2DD; background: #FFFFFF; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
        <a href="Contact.dc.html" style="background: #C9A24B; color: #0B1F3A; font-weight: 700; font-size: 15px; padding: 13px 22px; border-radius: 4px;">Request a quote</a>
      </div>
    </div>
  </div>
  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; top: 100%; background: #FFFFFF; border-top: 1px solid #E3E7EE; box-shadow: 0 28px 48px rgba(11,31,58,0.20);">
      <div style="max-width: 1360px; margin: 0 auto; padding: 32px 40px 40px;">
        <div style="display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: baseline; justify-content: space-between; margin-bottom: 24px;">
          <p style="margin: 0; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 22px;">The ten companies of OysterCore Group</p>
          <a href="Group.dc.html" style="font-weight: 700; border-bottom: 2px solid #C9A24B; padding-bottom: 2px;">View the group structure</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;">
          <sc-for list="{{companies}}" as="c" hint-placeholder-count="10">
            <a href="Company.dc.html" style="display: block; border: 1px solid #E3E7EE; border-radius: 6px; overflow: hidden; background: #FFFFFF;">
              <div style="height: 92px; background: {{c.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px;">{{c.code}}</div>
              <p style="margin: 0; padding: 12px 14px; font-weight: 700; font-size: 14px;">{{c.name}}</p>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":""},"$preview":{"width":1440,"height":120}}'>
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const active = this.props.active ?? '';
    const open = this.state.open;
    const colors = ['#1D4ED8', '#0F766E', '#B45309', '#7C3AED', '#BE123C', '#15803D', '#0369A1', '#A16207', '#C2410C', '#475569'];
    const companies = colors.map((color, i) => ({ color, code: 'C' + String(i + 1).padStart(2, '0'), name: 'Company ' + String(i + 1).padStart(2, '0') }));
    const items = [
      { key: 'about', label: 'About us', href: '#' },
      { key: 'group', label: 'Our companies', href: 'Group.dc.html', menu: true },
      { key: 'services', label: 'Services', href: '#' },
      { key: 'industries', label: 'Industries', href: '#' },
      { key: 'projects', label: 'Projects', href: '#' },
      { key: 'news', label: 'News', href: '#' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' },
    ];
    return {
      nav: items.map((i) => ({
        ...i,
        isMenu: !!i.menu,
        isLink: !i.menu,
        expanded: open ? 'true' : 'false',
        toggle: () => this.setState({ open: !this.state.open }),
        line: i.key === active || (i.menu && open) ? '#C9A24B' : 'transparent',
      })),
      menuOpen: open,
      companies,
    };
  }
}
</script>
</body>
</html>
